format_version: "13"
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git

include:
- repository: steps-check
  branch: master
  path: yamlfmt.bitrise.yml
- repository: steps-check
  branch: master
  path: step-metadata.bitrise.yml
- repository: steps-check
  branch: master
  path: golang.bitrise.yml

app:
  envs:
  - STEP_VERSION: 2.1.0

  # define these in your .bitrise.secrets.yml
  - TEST_AUTH_TOKEN: "$TEST_AUTH_TOKEN"
  - TEST_REPOSITORY_URL: $TEST_REPOSITORY_URL
  - TEST_GIT_COMMIT: $TEST_GIT_COMMIT
  - TEST_BUILD_URL: $TEST_BUILD_URL
  - STEP_ID_IN_STEPLIB: github-status

workflows:
  # ----------------------------------------------------------------
  # --- workflow to Step Test
  ci:
    steps:
    - bundle::yamlfmt: {}
    - bundle::step-yml-audit: {}
    - script@1:
        title: Add GOPATH/bin to PATH
        inputs:
        - content: |-
            #!/bin/env bash
            set -eo pipefail
            # The golangci-lint bundle installs into $(go env GOPATH)/bin and then invokes the
            # binary by name. That directory is not on PATH on this stack, where Go is managed
            # by asdf, so the bundle fails with "golangci-lint: command not found".
            envman add --key PATH --value "$(go env GOPATH)/bin:$PATH"
    - bundle::golangci-lint:
        inputs:
        - golangci_lint_version: 2.11.4
    - bundle::go-test: {}
    after_run:
    - _test_invalid
    - _test_success
    - _test_failed
    - _test_no_commit_hash

  _test_success:
    steps:
    - path::./:
        title: Test success status
        is_skippable: false
        inputs:
        - auth_token: "$TEST_AUTH_TOKEN"
        - repository_url: "$TEST_REPOSITORY_URL"
        - commit_hash: "$TEST_GIT_COMMIT"
        - build_url: $TEST_BUILD_URL
        - verbose: "yes"

  _test_invalid:
    steps:
    - path::./:
        title: Test invalid commit hash
        inputs:
        - auth_token: "$TEST_AUTH_TOKEN"
        - repository_url: "$TEST_REPOSITORY_URL"
        - commit_hash: "invalid"
        - build_url: $TEST_BUILD_URL

  _test_failed:
    steps:
    - path::./:
        title: Test failed status
        inputs:
        - auth_token: "$TEST_AUTH_TOKEN"
        - repository_url: "$TEST_REPOSITORY_URL"
        - commit_hash: "$TEST_GIT_COMMIT"
        - set_specific_status: failure
        - build_url: $TEST_BUILD_URL

  _test_no_commit_hash:
    steps:
    - path::./:
        title: Test no commit hash specified
        inputs:
        - auth_token: "$TEST_AUTH_TOKEN"
        - repository_url: "$TEST_REPOSITORY_URL"
        - commit_hash:
        - build_url: $TEST_BUILD_URL
